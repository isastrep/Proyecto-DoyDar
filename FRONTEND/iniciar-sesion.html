
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoyDar - Iniciar sesión</title>
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://use.typekit.net/lgz1piq.css">
</head>

<body class="pagina-inicio-sesion">

    <div id="header">

        <header>
            <h1><a href="index.html">Doy Dar</a></h1>
            <img id="perfil_usuario"
                 src="imagenes/inicio/perfil_usuario.avif"
                 alt="Perfil del usuario">
        </header>

    </div>

    <main class="pantalla-completa">

        <section class="contenido-inicio-sesion">

            <h2>¡Bienvenido!</h2>

            <div class="formulario-inicio-sesion">

                <input type="text"
                       placeholder="Nombre">

                <input type="email"
                       placeholder="Correo">

                <input type="password"
                       placeholder="Contraseña">

                <p>¿Olvidaste tu contraseña?</p>

            </div>

        </section>

        <button type="button" id="iniciar-sesion">
            <p>Iniciar sesión</p>
        </button>

    </main>

</body>

</html>
